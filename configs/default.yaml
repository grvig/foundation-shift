# Single source of truth for every run in this project.
#
# Nothing outside this file sets a seed, a split or a hyperparameter. If a number here
# changes, every CSV in results/ has to be regenerated.

seed: 20261005

paths:
  # Images (about 21 GB) and cached embeddings live outside the repository, and outside
  # any synced folder such as OneDrive. The WILDS_DATA environment variable overrides this.
  data_root: ~/wilds-data
  results_dir: results
  figures_dir: figures

datasets:
  camelyon17:
    version: "1.0"
    # The official WILDS bundle. Single files download fine from it, so labels, hospitals
    # and splits come from here: metadata.csv is the source of truth for every number.
    bundle_url: https://worksheets.codalab.org/rest/bundles/0xe45e15f39fb54e9d9e919556af67aabe/contents/blob/
    # The images come from a copy on Hugging Face, pinned to one revision. The bundle can
    # only be fetched whole as a 10 GB stream that cannot resume, and it dropped partway
    # through more than once. Every mirror row is checked against the official metadata,
    # and a sample of images is compared pixel by pixel with the official files.
    mirror_repo: wltjr1007/Camelyon17-WILDS
    mirror_revision: d784d5344ba6c967f83f9f3d9b2f1e2a4d6eb78f
    spot_checks: 100
    extract_subdir: camelyon17_v1.0
    # Official WILDS split: train on hospitals 0, 3 and 4, validate out of distribution on
    # hospital 1, test on hospital 2. No image from hospitals 1 or 2 is seen in training.
    val_center: 1
    test_center: 2
    metric: accuracy

# The four pretrained image models compared. Each turns an image into one vector; every
# method in this project works from those vectors or fine-tunes the model behind them.
backbones:
  # Supervised on ImageNet labels. The pre-foundation-model baseline.
  resnet50:
    library: timm
    name: resnet50.tv_in1k
    image_size: 224
  # Contrastive image-text training on 400M web pairs.
  clip_b16:
    library: open_clip
    name: ViT-B-16
    pretrained: openai
    image_size: 224
  # Image-text training with a sigmoid loss on a larger web corpus.
  siglip_b16:
    library: open_clip
    name: ViT-B-16-SigLIP
    pretrained: webli
    image_size: 224
  # Self-supervised on images alone, no labels and no text. Trained at 518 pixels; run at
  # 224 like the others, with timm interpolating the position embeddings.
  dinov2_b14:
    library: timm
    name: vit_base_patch14_dinov2.lvd142m
    image_size: 224

embedding:
  batch_size: 128
  # About 400 images/s reach the GPU whether 4 or 8 workers decode, so 4 it is. That is
  # below what ResNet-50 could take but above what the three transformer backbones can.
  num_workers: 4
  # Embeddings are written in shards so an interrupted run resumes from the last shard.
  shard_size: 50000

# A logistic regression on frozen embeddings. The backbone is untouched, so this measures
# how much of the task is already linearly readable from what the backbone learned.
linear_probe:
  # Inverse regularisation strengths tried; one is chosen on a validation split.
  c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  # WILDS chooses hyperparameters on the out-of-distribution validation split (hospital 1).
  # A real deployment has no labelled data from the new site, so choosing on the
  # in-distribution split is reported too; the gap between the two is a finding in itself.
  selection_splits: [ood_val, id_val]

# Classification from written descriptions alone, for the image-text backbones. Each class
# is described once per template; the template embeddings are averaged into one vector
# per class (prompt ensembling). Prompts are fixed here before any result is seen, so
# they cannot be tuned against the test hospital.
zero_shot:
  camelyon17:
    # One description per label, in label order: 0 = normal, 1 = tumour. American
    # spelling, as in most of the web text these models were trained on.
    classes:
      - "normal lymph node tissue"
      - "lymph node tissue containing metastatic tumor"
    templates:
      - "a histopathology image of {}."
      - "an H&E stained microscope image of {}."
      - "a close-up pathology slide of {}."

# Intervals resample whole slides, not patches (see src/evaluation/bootstrap.py).
bootstrap:
  resamples: 1000
  cluster_column: slide
